<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Georgia", "Times New Roman", serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: #f5f0e6;
      overflow: hidden;
      position: relative;
      padding: 2rem;
      text-align: center;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 42rem;
    }

    .ornament {
      font-size: 1.6rem;
      color: #d4af7a;
      letter-spacing: 0.5rem;
      margin-bottom: 1.8rem;
      animation: fadeDown 1.2s ease forwards;
      opacity: 0;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.4rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.02em;
      line-height: 1.35;
      margin-bottom: 1.5rem;
      animation: fadeDown 1.2s ease 0.2s forwards;
      opacity: 0;
    }

    h1 span {
      color: #d4af7a;
      display: block;
      margin-top: 0.4rem;
      font-style: normal;
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    .divider {
      width: 5rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4af7a, transparent);
      margin: 0 auto 2rem;
      animation: grow 1.2s ease 0.5s forwards;
      transform: scaleX(0);
    }

    .subtitle {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #cfd8dc;
      margin-bottom: 2.5rem;
      animation: fadeDown 1.2s ease 0.7s forwards;
      opacity: 0;
    }

    .cta {
      display: inline-block;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f5f0e6;
      text-decoration: none;
      border: 1px solid #d4af7a;
      padding: 0.9rem 2.4rem;
      border-radius: 999px;
      transition: all 0.35s ease;
      animation: fadeDown 1.2s ease 0.9s forwards;
      opacity: 0;
    }

    .cta:hover {
      background: #d4af7a;
      color: #0f2027;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(212, 175, 122, 0.35);
    }

    .footer {
      position: absolute;
      bottom: 2rem;
      z-index: 1;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(207, 216, 220, 0.55);
      animation: fadeDown 1.2s ease 1.1s forwards;
      opacity: 0;
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="content">
    <div class="ornament">&#10086; &#10022; &#10086;</div>
    <h1>
      Thank you for your time spent
      <span>and wish you all the Best!</span>
    </h1>
    <div class="divider"></div>
    <p class="subtitle">Wishing you success, happiness, and endless bright moments ahead.</p>
    <a href="#" class="cta">Onward &amp; Upward</a>
  </div>

  <div class="footer">&mdash; With gratitude &mdash;</div>

  <script>
    const stars = document.getElementById("stars");
    for (let i = 0; i < 80; i++) {
      const star = document.createElement("div");
      star.className = "star";
      const size = Math.random() * 2.5 + 1;
      star.style.width = size + "px";
      star.style.height = size + "px";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.animationDelay = Math.random() * 3 + "s";
      star.style.animationDuration = Math.random() * 3 + 2 + "s";
      stars.appendChild(star);
    }
  </script>
</body>
</html>
